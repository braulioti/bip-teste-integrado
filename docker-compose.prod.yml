name: bip-teste-integrado

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bip_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-module
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bip_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

  liquibase:
    build:
      context: ./db/liquibase
      dockerfile: Dockerfile
    profiles:
      - migration
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/liquibase/changelog/db:ro
    entrypoint: ["liquibase"]
    command:
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bip_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - --changeLogFile=/liquibase/changelog/db/changelog/db.changelog-master.yaml
      - update

volumes:
  postgres_data:
