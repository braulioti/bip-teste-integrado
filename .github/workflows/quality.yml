name: Quality and Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests-and-coverage:
    name: Backend and frontend tests
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests with JaCoCo
        run: mvn -B -pl backend-module -am verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests with Jest
        run: npm run test:ci
        working-directory: frontend

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend-module/target/surefire-reports/*.xml
            backend-module/target/site/jacoco/jacoco.xml

      - name: Upload frontend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/reports/jest/junit.xml
            frontend/coverage/lcov.info
            frontend/coverage/cobertura-coverage.xml

      - name: Upload backend coverage to Codacy
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        shell: bash
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --partial \
            -t "${CODACY_PROJECT_TOKEN}" \
            -l Java \
            -r backend-module/target/site/jacoco/jacoco.xml

      - name: Upload frontend coverage to Codacy
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        shell: bash
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --partial \
            -t "${CODACY_PROJECT_TOKEN}" \
            -r frontend/coverage/lcov.info

      - name: Finalize Codacy coverage upload
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        shell: bash
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) final \
            -t "${CODACY_PROJECT_TOKEN}"
